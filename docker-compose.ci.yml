version: '3.8'

services:
  # MySQL 데이터베이스
  db:
    image: mysql:8.0
    container_name: stock_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-stock123!}
      MYSQL_DATABASE: ${DB_NAME:-stock_db}
      MYSQL_USER: ${DB_USER:-stock_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - stock_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-stock123!}"]
      timeout: 20s
      retries: 10
      interval: 30s

  # Spring Boot 백엔드 (app 프로파일)
  app:
    image: ${APP_IMAGE:-stock-backend:dev}
    container_name: stock_app
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME:-stock_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-stock_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-stock123!}
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock_network
    profiles: ["app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

  # React 프론트엔드 (web 프로파일)
  web:
    image: ${WEB_IMAGE:-stock-frontend:dev}
    container_name: stock_web
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock_network
    profiles: ["web"]
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/share/nginx/html/index.html"]
      timeout: 10s
      retries: 5
      interval: 30s

volumes:
  mysql_data:
    driver: local

networks:
  stock_network:
    driver: bridge
