services:
  keyword-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ../news:/app/news:ro  # CSV 파일이 있는 디렉토리를 읽기 전용으로 마운트
      - .:/app:rw  # 개발 시 코드 변경을 위한 마운트
    environment:
      - PYTHONPATH=/app
      - SPARK_LOCAL_IP=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

