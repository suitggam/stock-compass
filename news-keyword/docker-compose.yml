version: '3.8'

services:
  # Hadoop NameNode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./hadoop-config/core-site.xml:/opt/hadoop-3.2.1/etc/hadoop/core-site.xml
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop-3.2.1/etc/hadoop/hdfs-site.xml
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - hadoop-network

  # Hadoop DataNode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - ./hadoop-config/core-site.xml:/opt/hadoop-3.2.1/etc/hadoop/core-site.xml
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop-3.2.1/etc/hadoop/hdfs-site.xml
    env_file:
      - ./hadoop-config/hadoop.env
    depends_on:
      - namenode
    networks:
      - hadoop-network

  # Hadoop ResourceManager
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    ports:
      - "8088:8088"
    volumes:
      - ./hadoop-config/core-site.xml:/opt/hadoop-3.2.1/etc/hadoop/core-site.xml
      - ./hadoop-config/yarn-site.xml:/opt/hadoop-3.2.1/etc/hadoop/yarn-site.xml
    env_file:
      - ./hadoop-config/hadoop.env
    depends_on:
      - namenode
    networks:
      - hadoop-network

  # Hadoop NodeManager
  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    volumes:
      - ./hadoop-config/core-site.xml:/opt/hadoop-3.2.1/etc/hadoop/core-site.xml
      - ./hadoop-config/yarn-site.xml:/opt/hadoop-3.2.1/etc/hadoop/yarn-site.xml
    env_file:
      - ./hadoop-config/hadoop.env
    depends_on:
      - resourcemanager
    networks:
      - hadoop-network

  # Jupyter Notebook for development and Spark execution
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark-apps:/home/jovyan/work/spark-apps
      - ./news:/home/jovyan/work/news
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - hadoop-network

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  hadoop-network:
    driver: bridge
