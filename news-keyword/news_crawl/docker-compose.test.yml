version: '3.8'

# 로그인 테스트용 Docker Compose 설정

services:
  bigkinds-login-test:
    build:
      context: .
      dockerfile: Dockerfile.chromium
    container_name: bigkinds-login-test
    volumes:
      # 로그 파일을 호스트와 공유
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - DISPLAY=:99
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - DOCKER_ENV=true
      - SEARCH_PERIOD_DAYS=30
    # 로그인 테스트만 실행
    command: python test-login-docker.py
    restart: "no"
    mem_limit: 2g
    cpus: 1.0
