version: '3.8'

services:
  spark-master:
    image: apache/spark:3.4.1-scala2.12-java11-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master port
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - JAVA_HOME=/opt/java/openjdk
      - SPARK_HOME=/opt/spark
    volumes:
      - ./data:/opt/spark/data
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    networks:
      - spark-network
    command: >
      bash -c "
        /opt/spark/sbin/start-master.sh &&
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-*.out
      "

  spark-worker-1:
    image: apache/spark:3.4.1-scala2.12-java11-python3-ubuntu
    container_name: spark-worker-1
    hostname: spark-worker-1
    ports:
      - "8081:8081"  # Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_HOST=spark-worker-1
      - SPARK_WORKER_WEBUI_PORT=8081
      - JAVA_HOME=/opt/java/openjdk
      - SPARK_HOME=/opt/spark
    volumes:
      - ./data:/opt/spark/data
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    depends_on:
      - spark-master
    networks:
      - spark-network
    command: >
      bash -c "
        sleep 15 &&
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-*.out
      "

  spark-worker-2:
    image: apache/spark:3.4.1-scala2.12-java11-python3-ubuntu
    container_name: spark-worker-2
    hostname: spark-worker-2
    ports:
      - "8082:8081"  # Worker Web UI (포트 충돌 방지)
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_HOST=spark-worker-2
      - SPARK_WORKER_WEBUI_PORT=8081
      - JAVA_HOME=/opt/java/openjdk
      - SPARK_HOME=/opt/spark
    volumes:
      - ./data:/opt/spark/data
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    depends_on:
      - spark-master
    networks:
      - spark-network
    command: >
      bash -c "
        sleep 20 &&
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
        tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-*.out
      "

  spark-client:
    build:
      context: .
      dockerfile: Dockerfile.spark-client
    container_name: spark-client
    hostname: spark-client
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JAVA_HOME=/opt/java/openjdk
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      - HOME=/root
      - USER=root
    volumes:
      - ./data:/opt/spark/data
      - ./jobs:/opt/spark/jobs
      - ./output:/opt/spark/output
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    networks:
      - spark-network
    stdin_open: true
    tty: true
    restart: "no"
    command: ["tail", "-f", "/dev/null"]

networks:
  spark-network:
    driver: bridge